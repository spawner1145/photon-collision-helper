plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}
version = '0.1.4'
group = 'dev.photoncollision'
base { archivesName = 'photon-collision-helper-neoforge-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
repositories { mavenCentral() }
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
def photonJar = file("${gameDir}/mods/photon-neoforge-1.21.1-2.2.8-all.jar")
def ldlibJar = file("${gameDir}/mods/ldlib2-neoforge-1.21.1-2.2.42-all.jar")
def extractLibraries = tasks.register('extractCompileLibraries', Sync) {
    from(zipTree(ldlibJar)) { include 'META-INF/jarjar/*.jar' }
    from(zipTree(photonJar)) { include 'META-INF/jarjar/*.jar' }
    into layout.buildDirectory.dir('compile-libraries')
}
neoForge {
    version = '21.1.252'
    mods { photon_collision_helper { sourceSet sourceSets.main } }
}
dependencies {
    implementation files(photonJar, ldlibJar)
    compileOnly files(fileTree(layout.buildDirectory.dir('compile-libraries')) { include '**/*.jar' }).builtBy(extractLibraries)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test {
    useJUnitPlatform()
    classpath += files(fileTree(layout.buildDirectory.dir('compile-libraries')) { include '**/*.jar' })
}
